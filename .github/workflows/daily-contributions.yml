name: DevAtlas Daily Contribution Sync

on:
  schedule:
    # Runs at 06:00 UTC and 14:00 UTC every day
    - cron: '0 6,14 * * *'
  workflow_dispatch:

jobs:
  daily-pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Quality Verification Tests
        run: node test/run-tests.js

      - name: Auto-record Daily Metric Sync
        run: |
          git config --global user.name "Freda"
          git config --global user.email "fredapacitan@gmail.com"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"lastActiveSync\": \"$TIMESTAMP\"}" > .sync-status.json
          git add .sync-status.json
          git commit -m "chore(sync): automated daily algorithmic validation [$TIMESTAMP]" || exit 0
          git push origin main
